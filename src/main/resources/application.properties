# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Gemini API Configuration
# Reads from GEMINI_API_KEY environment variable. Defaults to empty string if not set.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.connect-timeout=15000
gemini.api.read-timeout=60000
gemini.api.temperature=0.7
gemini.api.max-output-tokens=4096

# Spring MVC & Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartchat=DEBUG
logging.level.org.springframework.web=INFO

